services:
  - type: web
    name: specthread-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    # CI deploys each merge after applying its migrations (ADR-044, .github/workflows/ci.yml).
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Database
        sync: false
      - key: Auth__Issuer
        sync: false
